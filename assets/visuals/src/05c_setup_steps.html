<html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:1920px;height:1200px;background:#141417;font-family:Inter,sans-serif;color:#F2EEE9;overflow:hidden}
text{font-family:Inter,sans-serif}.m{font-family:'JetBrains Mono',monospace}</style></head><body><svg width="1920" height="1200"><text x="60" y="80" font-size="48" font-weight="800" fill="#F2EEE9">Pyra Claw · <tspan fill="#FF6A1A">Setup, Step by Step</tspan></text><text x="60" y="122" font-size="24" fill="#9A938C">Generic guide · service names, paths and pins are examples — match them to your own code.</text><rect x="60" y="170" width="580" height="460" rx="26" fill="#1F1F24" stroke="#2E2E35" stroke-width="2"/><circle cx="130" cy="242" r="40" fill="#FF6A1A"/><text x="130" y="256" text-anchor="middle" font-size="40" font-weight="900" fill="#141417">1</text><text x="190" y="254" font-size="32" font-weight="800" fill="#F2EEE9">Flash Raspberry Pi OS</text><circle cx="104" cy="312" r="6" fill="#FF8A3D"/><text x="124" y="320" font-size="22" fill="#CFC8C0">Raspberry Pi Imager → Raspberry Pi OS</text><text x="124" y="350" font-size="22" fill="#CFC8C0">(64-bit), Lite is fine</text><circle cx="104" cy="398" r="6" fill="#FF8A3D"/><text x="124" y="406" font-size="22" fill="#CFC8C0">OS customisation: hostname pyra-hub, user,</text><text x="124" y="436" font-size="22" fill="#CFC8C0">Wi-Fi, enable SSH</text><circle cx="104" cy="484" r="6" fill="#FF8A3D"/><text x="124" y="492" font-size="22" fill="#CFC8C0">Boot Pi 5 (official 27 W USB-C PSU</text><text x="124" y="522" font-size="22" fill="#CFC8C0">recommended)</text><circle cx="104" cy="570" r="6" fill="#FF8A3D"/><text x="124" y="578" font-size="22" fill="#CFC8C0">ssh into pyra-hub.local; sudo apt update &amp;&amp;</text><text x="124" y="608" font-size="22" fill="#CFC8C0">sudo apt full-upgrade</text><rect x="670" y="170" width="580" height="460" rx="26" fill="#1F1F24" stroke="#2E2E35" stroke-width="2"/><circle cx="740" cy="242" r="40" fill="#FF6A1A"/><text x="740" y="256" text-anchor="middle" font-size="40" font-weight="900" fill="#141417">2</text><text x="800" y="254" font-size="32" font-weight="800" fill="#F2EEE9">Install the hub service</text><circle cx="714" cy="312" r="6" fill="#FF8A3D"/><text x="734" y="320" font-size="22" fill="#CFC8C0">sudo apt install mosquitto mosquitto-clients</text><circle cx="714" cy="368" r="6" fill="#FF8A3D"/><text x="734" y="376" font-size="22" fill="#CFC8C0">Copy/clone the pyra-hub service onto the Pi</text><text x="734" y="406" font-size="22" fill="#CFC8C0">(your repo)</text><circle cx="714" cy="454" r="6" fill="#FF8A3D"/><text x="734" y="462" font-size="22" fill="#CFC8C0">Configure: broker, node list, PC MAC, pulse</text><text x="734" y="492" font-size="22" fill="#CFC8C0">cap 300 ms, approval on</text><circle cx="714" cy="540" r="6" fill="#FF8A3D"/><text x="734" y="548" font-size="22" fill="#CFC8C0">Enable as systemd unit: sudo systemctl</text><text x="734" y="578" font-size="22" fill="#CFC8C0">enable --now pyra-hub</text><rect x="1280" y="170" width="580" height="460" rx="26" fill="#1F1F24" stroke="#2E2E35" stroke-width="2"/><circle cx="1350" cy="242" r="40" fill="#FF6A1A"/><text x="1350" y="256" text-anchor="middle" font-size="40" font-weight="900" fill="#141417">3</text><text x="1410" y="254" font-size="32" font-weight="800" fill="#F2EEE9">Flash the ESP32 nodes</text><circle cx="1324" cy="312" r="6" fill="#FF8A3D"/><text x="1344" y="320" font-size="22" fill="#CFC8C0">Arduino IDE / PlatformIO / esptool via USB</text><circle cx="1324" cy="368" r="6" fill="#FF8A3D"/><text x="1344" y="376" font-size="22" fill="#CFC8C0">Set Wi-Fi SSID, hub broker address, node id</text><text x="1344" y="406" font-size="22" fill="#CFC8C0">(esp32-wake)</text><circle cx="1324" cy="454" r="6" fill="#FF8A3D"/><text x="1344" y="462" font-size="22" fill="#CFC8C0">esp32-wake: PC MAC for WOL, pulse GPIO (e.g.</text><text x="1344" y="492" font-size="22" fill="#CFC8C0">26) → PC817</text><circle cx="1324" cy="540" r="6" fill="#FF8A3D"/><text x="1344" y="548" font-size="22" fill="#CFC8C0">Mount pod inside the PC; wire per the wiring</text><text x="1344" y="578" font-size="22" fill="#CFC8C0">diagram</text><rect x="60" y="670" width="580" height="460" rx="26" fill="#1F1F24" stroke="#2E2E35" stroke-width="2"/><circle cx="130" cy="742" r="40" fill="#FF6A1A"/><text x="130" y="756" text-anchor="middle" font-size="40" font-weight="900" fill="#141417">4</text><text x="190" y="754" font-size="32" font-weight="800" fill="#F2EEE9">Enable Wake-on-LAN</text><circle cx="104" cy="812" r="6" fill="#FF8A3D"/><text x="124" y="820" font-size="22" fill="#CFC8C0">BIOS/UEFI: enable Wake on LAN / Power On by</text><text x="124" y="850" font-size="22" fill="#CFC8C0">PCI-E</text><circle cx="104" cy="898" r="6" fill="#FF8A3D"/><text x="124" y="906" font-size="22" fill="#CFC8C0">BIOS/UEFI: disable ErP / EuP / Deep Sleep</text><circle cx="104" cy="954" r="6" fill="#FF8A3D"/><text x="124" y="962" font-size="22" fill="#CFC8C0">Windows: NIC → Power Mgmt → Allow this</text><text x="124" y="992" font-size="22" fill="#CFC8C0">device to wake; Advanced → Wake on Magic</text><text x="124" y="1022" font-size="22" fill="#CFC8C0">Packet</text><circle cx="104" cy="1070" r="6" fill="#FF8A3D"/><text x="124" y="1078" font-size="22" fill="#CFC8C0">Linux: sudo ethtool -s &lt;iface&gt; wol g</text><text x="124" y="1108" font-size="22" fill="#CFC8C0">(persist it)</text><rect x="670" y="670" width="580" height="460" rx="26" fill="#1F1F24" stroke="#2E2E35" stroke-width="2"/><circle cx="740" cy="742" r="40" fill="#FF6A1A"/><text x="740" y="756" text-anchor="middle" font-size="40" font-weight="900" fill="#141417">5</text><text x="800" y="754" font-size="32" font-weight="800" fill="#F2EEE9">Pair the phone app</text><circle cx="714" cy="812" r="6" fill="#FF8A3D"/><text x="734" y="820" font-size="22" fill="#CFC8C0">Install the Pyra Claw APK (allow install</text><text x="734" y="850" font-size="22" fill="#CFC8C0">from this source)</text><circle cx="714" cy="898" r="6" fill="#FF8A3D"/><text x="734" y="906" font-size="22" fill="#CFC8C0">Connect: USB-C OTG cable to hub, or same</text><text x="734" y="936" font-size="22" fill="#CFC8C0">Wi-Fi</text><circle cx="714" cy="984" r="6" fill="#FF8A3D"/><text x="734" y="992" font-size="22" fill="#CFC8C0">Add hub: pyra-hub.local or IP; confirm</text><text x="734" y="1022" font-size="22" fill="#CFC8C0">pairing on hub OLED</text><circle cx="714" cy="1070" r="6" fill="#FF8A3D"/><text x="734" y="1078" font-size="22" fill="#CFC8C0">App registers as droidcommand-AI node; nodes</text><text x="734" y="1108" font-size="22" fill="#CFC8C0">appear on Dashboard</text><rect x="1280" y="670" width="580" height="460" rx="26" fill="#1F1F24" stroke="#2E2E35" stroke-width="2"/><circle cx="1350" cy="742" r="40" fill="#FF6A1A"/><text x="1350" y="756" text-anchor="middle" font-size="40" font-weight="900" fill="#141417">6</text><text x="1410" y="754" font-size="32" font-weight="800" fill="#F2EEE9">First checks</text><circle cx="1324" cy="812" r="6" fill="#FF8A3D"/><text x="1344" y="820" font-size="22" fill="#CFC8C0">PC in sleep/off → tap Wake PC → watch Logs</text><circle cx="1324" cy="868" r="6" fill="#FF8A3D"/><text x="1344" y="876" font-size="22" fill="#CFC8C0">Only if WOL fails: Power Pulse → hold to</text><text x="1344" y="906" font-size="22" fill="#CFC8C0">approve</text><circle cx="1324" cy="954" r="6" fill="#FF8A3D"/><text x="1344" y="962" font-size="22" fill="#CFC8C0">Confirm a single ~300 ms pulse</text><text x="1344" y="992" font-size="22" fill="#CFC8C0">(LED/multimeter) before trusting it</text><circle cx="1324" cy="1040" r="6" fill="#FF8A3D"/><text x="1344" y="1048" font-size="22" fill="#CFC8C0">Record what actually worked — nothing here</text><text x="1344" y="1078" font-size="22" fill="#CFC8C0">is pre-tested</text></svg></body></html>
