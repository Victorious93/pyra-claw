# Copy to /etc/pyra-claw/config.toml and edit.
[hub]
host = "0.0.0.0"
port = 8787
# Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
auth_token = "CHANGE_ME"
audit_log = "/var/lib/pyra-claw/audit.jsonl"
approval_ttl_s = 30

[mqtt]
host = "127.0.0.1"
port = 1883
# install.sh generates these and writes them to /etc/mosquitto/pyra-claw.passwd
username = "pyra-hub"
password = "CHANGE_ME_MQTT"
topic_prefix = "pyra/node"

[pc]
mac = "AA:BB:CC:DD:EE:FF"
broadcast = "255.255.255.255"
wake_node = "esp32-wake-01"

[node]
# Shared HMAC secret for signed node commands (protocol v0.2). Provision the SAME value
# into the ESP32 as NVS key `hub_token` (tools/provision.py ... hub_token=<value>).
# install.sh generates it and stores a copy in /etc/pyra-claw/node-credentials.
hub_token = "CHANGE_ME_NODE"
