<html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:1920px;height:1200px;background:#141417;font-family:Inter,sans-serif;color:#F2EEE9;overflow:hidden}
text{font-family:Inter,sans-serif}.m{font-family:'JetBrains Mono',monospace}</style></head><body><svg width="1920" height="1200"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF8A3D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7FB8FF"/></marker></defs><text x="60" y="80" font-size="46" font-weight="800" fill="#F2EEE9">Power Pulse Wiring · <tspan fill="#FF6A1A">ESP32 → PC817 → PWR_SW</tspan></text><rect x="1380" y="40" width="480" height="64" rx="14" fill="#3A1414" stroke="#FF5A4F" stroke-width="2"/><text x="1620" y="82" text-anchor="middle" font-size="26" font-weight="800" fill="#FF7A70">CONCEPT · NOT TESTED</text><text x="60" y="124" font-size="24" fill="#9A938C">Verify PWR_SW pin positions and polarity against YOUR motherboard manual before wiring.</text><rect x="80" y="230" width="380" height="520" rx="20" fill="#1F1F24" stroke="#FF6A1A" stroke-width="3"/><text x="270" y="285" text-anchor="middle" font-size="32" font-weight="800" fill="#F2EEE9">ESP32</text><text x="270" y="318" text-anchor="middle" font-size="20" fill="#9A938C">(esp32-wake node)</text><circle cx="460" cy="420" r="9" fill="#FF8A3D"/><text x="440" y="428" text-anchor="end" font-size="26" fill="#F2EEE9" class="m">GPIO26</text><text x="440" y="458" text-anchor="end" font-size="18" fill="#9A938C">(example; avoid strapping pins)</text><circle cx="460" cy="640" r="9" fill="#B9B2AA"/><text x="440" y="648" text-anchor="end" font-size="26" fill="#F2EEE9" class="m">GND</text><text x="270" y="720" text-anchor="middle" font-size="18" fill="#9A938C">3.3 V logic · drive HIGH ~300 ms</text><line x1="460" y1="420" x2="560" y2="420" stroke="#FF8A3D" stroke-width="4"/><polyline points="560,420 575,400 600,440 625,400 650,440 675,400 700,440 715,420" fill="none" stroke="#FFB347" stroke-width="4"/><text x="637" y="375" text-anchor="middle" font-size="26" font-weight="800" fill="#FFB347">R1 220–330 Ω</text><text x="637" y="480" text-anchor="middle" font-size="18" fill="#9A938C">≈6–10 mA LED current at 3.3 V</text><line x1="715" y1="420" x2="860" y2="420" stroke="#FF8A3D" stroke-width="4"/><line x1="460" y1="640" x2="860" y2="640" stroke="#B9B2AA" stroke-width="4"/><rect x="860" y="330" width="360" height="400" rx="16" fill="#26262B" stroke="#F2EEE9" stroke-width="3"/><text x="1040" y="310" text-anchor="middle" font-size="30" font-weight="800" fill="#F2EEE9">PC817 optocoupler</text><circle cx="880" cy="350" r="8" fill="#F2EEE9"/><rect x="846" y="408" width="28" height="24" fill="#B9B2AA"/><text x="890" y="429" text-anchor="start" font-size="22" fill="#F2EEE9" class="m">1 Anode</text><rect x="846" y="628" width="28" height="24" fill="#B9B2AA"/><text x="890" y="649" text-anchor="start" font-size="22" fill="#F2EEE9" class="m">2 Cathode</text><rect x="1206" y="408" width="28" height="24" fill="#B9B2AA"/><text x="1190" y="429" text-anchor="end" font-size="22" fill="#F2EEE9" class="m">4 Collector</text><rect x="1206" y="628" width="28" height="24" fill="#B9B2AA"/><text x="1190" y="649" text-anchor="end" font-size="22" fill="#F2EEE9" class="m">3 Emitter</text><polygon points="960,500 1000,500 980,540" fill="none" stroke="#FF8A3D" stroke-width="3"/><line x1="958" y1="540" x2="1002" y2="540" stroke="#FF8A3D" stroke-width="3"/><line x1="980" y1="465" x2="980" y2="500" stroke="#FF8A3D" stroke-width="3"/><line x1="980" y1="540" x2="980" y2="600" stroke="#FF8A3D" stroke-width="3"/><line x1="1015" y1="510" x2="1060" y2="510" stroke="#FFB347" stroke-width="2" marker-end="url(#a)"/><line x1="1015" y1="530" x2="1060" y2="530" stroke="#FFB347" stroke-width="2" marker-end="url(#a)"/><line x1="1090" y1="490" x2="1090" y2="560" stroke="#7FB8FF" stroke-width="4"/><line x1="1090" y1="505" x2="1140" y2="470" stroke="#7FB8FF" stroke-width="3"/><line x1="1090" y1="545" x2="1140" y2="580" stroke="#7FB8FF" stroke-width="3" marker-end="url(#b)"/><line x1="980" y1="465" x2="880" y2="420" stroke="#FF8A3D" stroke-width="2"/><line x1="980" y1="600" x2="880" y2="640" stroke="#B9B2AA" stroke-width="2"/><line x1="1140" y1="470" x2="1200" y2="420" stroke="#7FB8FF" stroke-width="2"/><line x1="1140" y1="580" x2="1200" y2="640" stroke="#7FB8FF" stroke-width="2"/><line x1="1040" y1="350" x2="1040" y2="710" stroke="#5E5953" stroke-width="2" stroke-dasharray="8 8"/><text x="1040" y="760" text-anchor="middle" font-size="18" fill="#9A938C">isolation barrier</text><line x1="1220" y1="420" x2="1500" y2="420" stroke="#7FB8FF" stroke-width="4"/><line x1="1220" y1="640" x2="1500" y2="640" stroke="#7FB8FF" stroke-width="4"/><rect x="1500" y="330" width="360" height="400" rx="16" fill="#1F1F24" stroke="#7FB8FF" stroke-width="3"/><text x="1680" y="310" text-anchor="middle" font-size="30" font-weight="800" fill="#F2EEE9">PC front-panel header</text><circle cx="1530" cy="420" r="10" fill="#7FB8FF"/><text x="1555" y="428" font-size="26" fill="#F2EEE9" class="m">PWR_SW +</text><text x="1555" y="458" font-size="18" fill="#9A938C">(signal / PWRBTN#)</text><circle cx="1530" cy="640" r="10" fill="#7FB8FF"/><text x="1555" y="648" font-size="26" fill="#F2EEE9" class="m">PWR_SW −</text><text x="1555" y="678" font-size="18" fill="#9A938C">(GND)</text><line x1="1400" y1="420" x2="1400" y2="820" stroke="#7FB8FF" stroke-width="3"/><line x1="1400" y1="640" x2="1460" y2="640" stroke="#7FB8FF" stroke-width="0"/><line x1="1340" y1="640" x2="1340" y2="900" stroke="#7FB8FF" stroke-width="3"/><circle cx="1400" cy="420" r="7" fill="#7FB8FF"/><circle cx="1340" cy="640" r="7" fill="#7FB8FF"/><line x1="1400" y1="820" x2="1460" y2="820" stroke="#7FB8FF" stroke-width="3"/><line x1="1340" y1="900" x2="1460" y2="900" stroke="#7FB8FF" stroke-width="3"/><rect x="1460" y="790" width="360" height="140" rx="14" fill="#1F1F24" stroke="#8A847E" stroke-width="2"/><text x="1640" y="845" text-anchor="middle" font-size="24" font-weight="800" fill="#F2EEE9">Case power button</text><text x="1640" y="880" text-anchor="middle" font-size="18" fill="#9A938C">momentary · kept connected</text><text x="1640" y="908" text-anchor="middle" font-size="18" fill="#9A938C">(wired in PARALLEL)</text><rect x="80" y="840" width="1220" height="320" rx="20" fill="#1A1A1E" stroke="#2E2E35"/><text x="110" y="885" font-size="26" font-weight="800" fill="#FF9A4D">Notes (concept — verify everything)</text><text x="110" y="925" font-size="20" fill="#CFC8C0">• Collector (pin 4) → PWR_SW + ; Emitter (pin 3) → PWR_SW −. The output is polarized — if it does nothing, check orientation.</text><text x="110" y="958" font-size="20" fill="#CFC8C0">• Splice or Y-split the case-button leads so the PC817 output and the button share the same two header pins.</text><text x="110" y="991" font-size="20" fill="#CFC8C0">• Pulse ~300 ms only. Holding ≥ ~4 s usually forces a hard power-off on most boards.</text><text x="110" y="1024" font-size="20" fill="#CFC8C0">• Choose a GPIO that stays LOW at boot/reset (e.g. GPIO26/27); avoid strapping pins 0, 2, 5, 12, 15.</text><text x="110" y="1057" font-size="20" fill="#CFC8C0">• To wake from full off, the ESP32 needs standby power (5VSB USB header with ErP off, or an external 5 V supply).</text><text x="110" y="1090" font-size="20" fill="#CFC8C0">• Alternative: a relay module's NO/COM contacts across PWR_SW (non-polarized). Firmware should cap pulse length.</text><text x="110" y="1123" font-size="20" fill="#CFC8C0">• Isolation is only real if the ESP32 is not sharing PC ground through its own power source.</text></svg></body></html>
